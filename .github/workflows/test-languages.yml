name: Test languages

# Per-language grammar build/test matrix. Replaces the former CircleCI
# `test-language` job (.circleci/config.yml, removed in #627).
#
# For each language from lang/scripts/list-languages, runs
# `./test-lang <lang>`. All failures are fatal.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# One matrix run per ref; newer pushes cancel the previous (saves minutes).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  enumerate:
    name: Enumerate languages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      # [{language, runner}, ...] — runner is JSON for runs-on (string or object)
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: list
        run: |
          set -euo pipefail
          # Heavy langs (tree-sitter generate OOM on standard ~16GB runners)
          # need org larger runners. Label is singular: ubuntu-latest-8-core.
          larger='{"group":"Default Larger Runners","labels":"ubuntu-latest-8-core"}'
          matrix=$(lang/scripts/list-languages | jq -R -s -c --arg larger "$larger" '
            split("\n")
            | map(select(length > 0))
            | map({
                language: .,
                runner: (if . == "c-sharp-pro" then $larger else "\"ubuntu-latest\"" end)
              })
          ')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  test-language:
    name: test-lang ${{ matrix.language }}
    needs: enumerate
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include: ${{ fromJSON(needs.enumerate.outputs.matrix) }}
    steps:
      - uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Install OCaml + opam directly (the old returntocorp/ocaml CircleCI
      # image is no longer pullable).
      - uses: ocaml/setup-ocaml@e32b06a3e831ff2fbc6f08cf35be2085e3918014 # v3.6.1
        with:
          ocaml-compiler: "5"
      - uses: ./.github/actions/build-core
      - name: test-lang ${{ matrix.language }}
        env:
          # Grammars with a C++ scanner make tree-sitter compile the generated
          # parser.c as C++ too, and g++ rejects its C99 designated
          # initializers ("non-trivial designated initializers not supported",
          # "designator order ... does not match declaration order"). There is
          # no g++ flag for either; clang++ accepts both. cc-rs (used by the
          # tree-sitter CLI loader) picks the C++ compiler from $CXX.
          CXX: clang++
        run: |
          set -euo pipefail
          eval "$(opam env)"
          cd lang
          ./test-lang "${{ matrix.language }}"

  # Single required check for branch protection (matrix expands to many jobs).
  test-languages:
    name: Test languages
    needs: test-language
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All languages passed
        run: |
          result="${{ needs.test-language.result }}"
          echo "matrix result: $result"
          test "$result" = "success"
