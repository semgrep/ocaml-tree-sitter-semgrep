name: Smoke larger runner

# Check access to org larger-runner labels shared to this repo.
on:
  push:
    paths:
      - '.github/workflows/smoke-larger-runner.yml'
  workflow_dispatch:

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest-8-cores
          - ubuntu-latest-2x
          - ubuntu-latest-16-cores
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - name: Prove the runner started
        run: |
          set -euo pipefail
          echo "label=${{ matrix.runner }}"
          nproc
          free -h
          uname -a
