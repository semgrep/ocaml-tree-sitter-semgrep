name: Smoke larger runner

# Check access to org larger runners in "Default Larger Runners".
# Labels are singular: ubuntu-latest-8-core (not -cores).
on:
  push:
    paths:
      - '.github/workflows/smoke-larger-runner.yml'
  workflow_dispatch:

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        label:
          - ubuntu-latest-8-core
          - ubuntu-latest-16-core
    runs-on:
      group: Default Larger Runners
      labels: ${{ matrix.label }}
    timeout-minutes: 10
    steps:
      - name: Prove the runner started
        run: |
          set -euo pipefail
          echo "label=${{ matrix.label }}"
          nproc
          free -h
          uname -a
