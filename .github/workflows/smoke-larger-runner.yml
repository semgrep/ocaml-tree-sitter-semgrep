name: Smoke larger runner

# One-shot check: does this repo have access to ubuntu-latest-8-cores?
on:
  push:
    paths:
      - '.github/workflows/smoke-larger-runner.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest-8-cores
    timeout-minutes: 5
    steps:
      - name: Prove the runner started
        run: |
          set -euo pipefail
          echo "runner labels OK"
          nproc
          free -h
          uname -a
