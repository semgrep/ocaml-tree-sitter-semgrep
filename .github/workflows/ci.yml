name: Build and test core

# Builds the ocaml-tree-sitter code generator (core/) and runs its OCaml test
# suite. Surfaced from core/.github (GitHub only runs workflows under the
# repository-root .github/). This covers core only; the per-language grammar
# builds are exercised separately.

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      # v3.4.3 does not declare save-opam-post-run, so the input below was
      # silently dropped ("Unexpected input(s) 'save-opam-post-run'") and the
      # switch was never cached after 'make setup'. This pin declares it.
      # cache-prefix carries the dependency set because the action's own key
      # does not: otherwise a dependency change keeps restoring a stale switch.
      - uses: semgrep/setup-ocaml@a739c5405d73c42ef15a9dc995efc0f87396cc36
        with:
          cache-prefix: v5-${{ hashFiles('core/*.opam') }}
          ocaml-compiler: ocaml-variants.5.3.0+options,ocaml-option-flambda
          opam-pin: false
          save-opam-post-run: true

      # tree-sitter's CLI is built from source with cargo; libclang is needed
      # for its Rust bindgen step. m4 and pkg-config are needed to build the
      # OCaml dependencies and to locate the tree-sitter runtime.
      - name: Set up build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev m4 pkg-config
          rustup default stable
          rustup update

      - uses: ./.github/actions/build-install-core

      - name: Test
        run: opam exec -- make test
